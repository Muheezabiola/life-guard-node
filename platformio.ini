; ============================================================
;  LifeGuard Node — firmware for the ESP32 monitoring node
;
;  One board, one environment:
;
;    pio run -e esp32dev -t upload     compile and flash
;    pio run -e esp32dev               compile only
;    pio device monitor -b 115200      serial log
;
;  Credentials are neither in this file nor in the sources. Copy
;  include\secrets.example.h to include\secrets.h and fill it in;
;  include/secrets.h is git-ignored and the build stops with a
;  clear #error while it is missing (see include/config.h).
;
;  README.md holds the wiring, the cloud data model and what each
;  operating mode does.
; ============================================================

[env:esp32dev]
; Pinned: the Arduino core changes between platform majors, and
; this firmware is written against the ESP32 core that ships with
; espressif32 7.x.
platform = espressif32 @ ^7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200

; --- Stop the serial monitor from resetting the board on open ---
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

lib_deps =
    ; Realtime Database over TLS, async client with email/password auth
    mobizt/FirebaseClient @ ^2.2.13
    ; I2C character display, marcoschwartz fork (init()/backlight())
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    ; DHT11/DHT22 driver — pulls in Adafruit Unified Sensor
    adafruit/DHT sensor library @ ^1.4.7
    ; Contactless infrared thermometer (MLX90614)
    adafruit/Adafruit MLX90614 Library @ ^2.1.6
    ; MAX3010x pulse oximeter, with Maxim's SpO2 algorithm
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
